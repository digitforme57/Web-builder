<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITFORM - Configuration Interne</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --primary-dark: #0b1120; /* Bleu très sombre pour le pro */
            --primary-yellow: #facc15;
            --danger-red: #ef4444;
            --success-green: #10b981;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --focus-ring: rgba(15, 23, 42, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        /* Conteneur global (mobile first) */
        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* --- HEADER --- */
        .topbar {
            background-color: var(--primary-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            color: var(--primary-yellow);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .live-badge {
            background-color: var(--danger-red);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .settings-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
        }

        /* --- NAVIGATION --- */
        .categories-nav {
            display: flex;
            overflow-x: auto;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }

        .cat-item.active {
            color: var(--primary-dark);
            border-bottom-color: var(--primary-dark);
        }

        .cat-item i { font-size: 1.2rem; }
        .cat-item:nth-child(1) i { color: #eab308; }
        .cat-item:nth-child(2) i { color: #10b981; }
        .cat-item:nth-child(3) i { color: #3b82f6; }
        .cat-item:nth-child(4) i { color: #0ea5e9; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Section Configuration Interne (Là où on met les yeux) */
        .config-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .config-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .config-header i {
            font-size: 1.5rem;
            color: var(--primary-dark);
            background: #e2e8f0;
            padding: 10px;
            border-radius: 10px;
        }

        .config-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .config-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-group label i {
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            padding-right: 40px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-dark);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .input-status {
            position: absolute;
            right: 12px;
            font-size: 1rem;
        }

        .status-connected { color: var(--success-green); }
        .status-disconnected { color: var(--text-muted); }

        /* Bouton de sauvegarde */
        .btn-save {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-save:hover {
            background-color: #1e293b;
        }

        /* État vide (Formations) */
        .empty-state {
            background: var(--bg-card);
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- FOOTER --- */
        .footer {
            background-color: var(--primary-dark);
            padding: 24px 20px;
            color: #ffffff;
            text-align: center;
            margin-top: auto;
        }

        .footer-logo {
            color: var(--primary-yellow);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- En-tête -->
        <header class="topbar">
            <div class="brand-area">
                <span class="logo">DIGITFORM</span>
                <span class="live-badge">
                    <span class="live-dot"></span> LIVE
                </span>
            </div>
            <div class="settings-btn">
                <i class="fas fa-sliders-h"></i>
                <span>Admin</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="categories-nav">
            <a href="#" class="cat-item active">
                <i class="fas fa-hand-holding-dollar"></i>
                <span>Monétisation</span>
            </a>
            <a href="#" class="cat-item">
                <i class="fas fa-shopping-bags"></i>
                <span>E-commerce</span>
            </a>
            <a href="#" class="cat-item">
                <i class="fas fa-file-lines"></i>
                <span>Documents</span>
            </a>
            <a href="#" class="cat-item">
                <i class="fas fa-globe"></i>
                <span>Site Internet</span>
            </a>
        </nav>

        <!-- Contenu Principal -->
        <main class="main-content">
            
            <!-- CONFIGURATION INTERNE (Les "Chefs de projet") -->
            <section class="config-section">
                <div class="config-header">
                    <i class="fas fa-server"></i>
                    <div>
                        <h2>Configuration Interne</h2>
                        <p>Clés d'API et Infrastructures</p>
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); alert('Configuration sauvegardée avec succès !');">
                    <!-- URL Claude -->
                    <div class="form-group">
                        <label><i class="fas fa-robot"></i> URL API Claude (Anthropic)</label>
                        <div class="input-wrapper">
                            <input type="url" value="https://api.anthropic.com/v1/messages" placeholder="https://api.anthropic.com/..." required>
                            <i class="fas fa-check-circle input-status status-connected" title="Connecté"></i>
                        </div>
                    </div>

                    <!-- URL Cloudflare -->
                    <div class="form-group">
                        <label><i class="fas fa-cloud"></i> URL Cloudflare Worker</label>
                        <div class="input-wrapper">
                            <input type="url" value="https://api.cloudflare.com/client/v4" placeholder="https://votre-worker.cloudflare.workers.dev" required>
                            <i class="fas fa-check-circle input-status status-connected" title="Connecté"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Mettre à jour le système
                    </button>
                </form>
            </section>

            <!-- NOS FORMATIONS (État vide) -->
            <section>
                <h1 style="text-align: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text-main);">Nos formations & services</h1>
                
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>Aucun produit disponible</h3>
                    <p>Le catalogue est en cours de mise à jour.<br>Revenez plus tard.</p>
                </div>
            </section>

        </main>

        <!-- Pied de page -->
        <footer class="footer">
            <h2 class="footer-logo">DIGITFORM</h2>
            <p class="footer-text">Formations et outils numériques</p>
        </footer>
    </div>

</body>
</html>
